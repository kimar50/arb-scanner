<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кабинет · ARB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#07101f;--panel:#0b1628;--panel2:#0f1e35;--raise:#132542;
  --rule:rgba(80,140,255,.12);--rule2:rgba(80,140,255,.25);
  --txt:#ddeeff;--dim:#6a96c8;--faint:#304f72;
  --gain:#1eff9a;--warn:#ffd060;--loss:#ff5f5f;--accent:#4da6ff;
  --mono:'JetBrains Mono',ui-monospace,'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--txt);font-family:var(--mono);font-size:13px;min-height:100vh}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;
  border-bottom:1px solid var(--rule2);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gain)}
.brand b{font-size:14px;font-weight:800;letter-spacing:.14em}
.back{font-size:12px;color:var(--dim);border:1px solid var(--rule2);padding:7px 14px;border-radius:6px}
.back:hover{color:var(--accent);border-color:var(--accent)}

.wrap{max-width:1060px;margin:0 auto;padding:36px 24px 80px}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.sub{color:var(--dim);margin-bottom:32px}

.card{background:var(--panel2);border:1px solid var(--rule2);border-radius:12px;
  padding:24px;margin-bottom:20px}
.card h2{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);
  margin-bottom:18px;font-weight:600}

.acct{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.acct img{width:52px;height:52px;border-radius:50%;border:1px solid var(--rule2)}
.acct .who{flex:1;min-width:180px}
.acct .who b{display:block;font-size:16px;font-weight:700}
.acct .who span{color:var(--dim);font-size:12px}
.badge{padding:6px 14px;border-radius:999px;font-size:12px;font-weight:800;
  border:1px solid var(--rule2);color:var(--dim)}
.badge.pro{color:var(--gain);border-color:rgba(30,255,154,.42);background:rgba(30,255,154,.08)}
.badge.vip{color:var(--warn);border-color:rgba(255,208,96,.42);background:rgba(255,208,96,.08)}
.logout{font-size:12px;color:var(--faint);border:1px solid var(--rule2);padding:7px 14px;border-radius:6px}
.logout:hover{color:var(--loss);border-color:var(--loss)}

.rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:18px}
.kv .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.kv .v{font-size:15px;font-weight:700}

.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.plan{border:1px solid var(--rule2);border-radius:11px;padding:22px;background:var(--panel);
  display:flex;flex-direction:column}
.plan.cur{border-color:var(--accent);background:linear-gradient(180deg,rgba(77,166,255,.07),var(--panel))}
.plan.best{border-color:var(--gain)}
.plan h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.plan .p{font-size:27px;font-weight:800;letter-spacing:-.02em;margin-bottom:2px}
.plan .p small{font-size:12px;font-weight:400;color:var(--faint)}
.plan ul{list-style:none;margin:16px 0;flex:1}
.plan li{font-size:12.5px;color:var(--dim);padding:5px 0;display:flex;gap:9px}
.plan li i{font-style:normal;color:var(--gain);flex:none}
.plan li.off{color:var(--faint)}.plan li.off i{color:var(--faint)}
.buy{border:1px solid var(--rule2);border-radius:8px;padding:11px;text-align:center;
  font-weight:700;font-size:12.5px;cursor:pointer;background:none;color:var(--txt);
  font-family:var(--mono);transition:.16s}
.buy:hover{border-color:var(--accent);color:var(--accent)}
.buy.hot{background:var(--gain);color:#04140c;border-color:var(--gain)}
.buy.hot:hover{filter:brightness(1.1);color:#04140c}
.buy:disabled{opacity:.45;cursor:default}

.pay{margin-top:20px;padding:20px;border:1px dashed var(--rule2);border-radius:10px;
  background:var(--panel);display:none}
.pay.show{display:block}
.pay h3{font-size:14px;font-weight:700;margin-bottom:12px}
.pay ol{margin:0 0 4px 18px;color:var(--dim);font-size:12.5px;line-height:2}
.addr{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}
.addr code{background:var(--raise);color:var(--gain);padding:9px 13px;border-radius:7px;
  font-size:12.5px;word-break:break-all;flex:1;min-width:200px}
.addr button{border:1px solid var(--rule2);background:none;color:var(--dim);padding:9px 14px;
  border-radius:7px;cursor:pointer;font-family:var(--mono);font-size:12px}
.addr button:hover{border-color:var(--accent);color:var(--accent)}
.amt{font-size:19px;font-weight:800;color:var(--warn)}

.months{display:flex;gap:8px;margin-bottom:16px}
.mb{border:1px solid var(--rule2);background:none;color:var(--dim);padding:7px 15px;
  border-radius:999px;cursor:pointer;font-family:var(--mono);font-size:12px}
.mb.on{background:var(--accent);color:#04101f;border-color:var(--accent);font-weight:700}

.hint{font-size:11.5px;color:var(--faint);line-height:1.8;margin-top:14px}
.hint a{color:var(--accent)}

@media(max-width:760px){
  .wrap{padding:24px 14px 60px}
  .plans{grid-template-columns:1fr}
  .topbar{padding:11px 14px}
}
</style>

</head>
<body>

<div class="topbar">
  <a class="brand" href="/" style="text-decoration:none;cursor:pointer"><span class="dot"></span><b>ARB SCREENER</b></a>
  <a class="back" href="/app">← К скринеру</a>
</div>

<div class="wrap">
  <h1>Личный кабинет</h1>
  <p class="sub">Аккаунт, подписка и оплата.</p>

  <div class="card">
    <h2>Аккаунт</h2>
    <div class="acct" id="acct"><span style="color:var(--faint)">загружаем…</span></div>
    <div class="rows" id="rows"></div>
  </div>

  <div class="card" id="plans-card" style="display:none">
    <h2>Тариф</h2>
    <div class="months">
      <button class="mb on" data-m="1"  onclick="setM(this)">1 месяц</button>
      <button class="mb"    data-m="3"  onclick="setM(this)">3 месяца −10%</button>
      <button class="mb"    data-m="12" onclick="setM(this)">12 месяцев −25%</button>
    </div>
    <div class="plans" id="plans"></div>
    <div class="pay" id="pay"></div>
  </div>

  <div class="card">
    <h2>Доступ</h2>
    <p style="color:var(--dim);line-height:1.9">
      Подписка пока не запущена — все зарегистрированные пользователи получают
      полный доступ бесплатно: <b style="color:var(--txt)">все 19 бирж, без задержки данных</b>.
    </p>
  </div>
</div>

<script>
const $ = s => document.getElementById(s);
let ME = {}, PLANS = {}, MONTHS = 1;
const DISCOUNT = {1:1, 3:0.9, 12:0.75};

async function boot(){
  ME = await (await fetch('/api/me')).json();
  const p = await (await fetch('/api/plans')).json();
  PLANS = p; renderAcct();
}

function renderAcct(){
  const tier = ME.tier || 'free';
  const cls = tier === 'pro' ? 'pro' : tier === 'vip' ? 'vip' : '';
  $('acct').innerHTML = `
    ${ME.picture ? `<img src="${ME.picture}" alt="">` : ''}
    <div class="who">
      <b>${ME.name || 'Трейдер'}</b>
      <span>${ME.email || 'вход не выполнен'}</span>
    </div>
    <span class="badge ${cls}">${ME.tier_name || 'Свободный'}</span>
    <a class="logout" href="/logout">Выйти</a>`;

  const until = ME.tier_until
    ? new Date(ME.tier_until * 1000).toLocaleDateString('ru-RU')
    : '—';
  const lim = ME.limits || {};
  $('rows').innerHTML = `
    <div class="kv"><div class="k">Подписка до</div><div class="v">${until}</div></div>
    <div class="kv"><div class="k">Задержка данных</div>
      <div class="v" style="color:${lim.delay ? 'var(--warn)' : 'var(--gain)'}">
        ${lim.delay ? lim.delay + ' сек' : 'нет'}</div></div>
    <div class="kv"><div class="k">Биржи</div>
      <div class="v">${lim.all_exchanges ? 'все 19' : '5 из 19'}</div></div>
    <div class="kv"><div class="k">Строк в таблице</div><div class="v">${lim.max_rows || 25}</div></div>`;
}

function setM(btn){
  MONTHS = +btn.dataset.m;
  document.querySelectorAll('.mb').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  renderPlans();
}

function renderPlans(){
  const cur = ME.tier || 'free';
  const meta = {
    free: {t:'Свободный', li:[['5 крупнейших бирж',1],['25 спредов',1],
           ['Задержка 90 секунд',0],['Без истории',0]]},
    pro:  {t:'Pro', li:[['Все 19 бирж',1],['Без задержки',1],
           ['500 спредов',1],['Избранное и история',1]]},
    vip:  {t:'VIP', li:[['Всё из Pro',1],['Доступ к API',1],
           ['Приоритетная поддержка',1],['Ранний доступ к биржам',1]]},
  };
  const prices = {free:0, pro:990, vip:2490};

  $('plans').innerHTML = ['free','pro','vip'].map(id => {
    const m = meta[id];
    const total = Math.round(prices[id] * MONTHS * DISCOUNT[MONTHS]);
    const isCur = cur === id;
    return `<div class="plan ${isCur ? 'cur' : ''} ${id === 'pro' ? 'best' : ''}">
      <h3>${m.t}</h3>
      <div class="p">${total.toLocaleString('ru-RU')} ₽<small> / ${MONTHS} мес</small></div>
      <ul>${m.li.map(([t,ok]) =>
        `<li class="${ok ? '' : 'off'}"><i>${ok ? '✓' : '·'}</i>${t}</li>`).join('')}</ul>
      ${id === 'free'
        ? `<button class="buy" disabled>${isCur ? 'Ваш тариф' : 'Базовый'}</button>`
        : `<button class="buy ${id === 'pro' ? 'hot' : ''}" onclick="order('${id}')">
             ${isCur ? 'Продлить' : 'Оформить'}</button>`}
    </div>`;
  }).join('');
}

async function order(plan){
  const r = await (await fetch('/api/order', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({plan, months: MONTHS})
  })).json();

  if(!r.ok){ alert(r.error || 'Не получилось создать заявку'); return; }

  const usdt = r.usdt_trc20;
  const tg = r.telegram_support;
  const box = $('pay');
  box.classList.add('show');
  box.innerHTML = `
    <h3>Заявка №${r.order_id} — ${plan.toUpperCase()}, ${MONTHS} мес</h3>
    <div style="margin-bottom:14px">К оплате: <span class="amt">${r.amount_rub.toLocaleString('ru-RU')} ₽</span></div>
    <ol>
      <li>Переведите сумму в USDT по курсу на момент оплаты (сеть TRC20)</li>
      <li>Пришлите хеш транзакции и номер заявки в поддержку</li>
      <li>Тариф включат в течение нескольких минут</li>
    </ol>
    ${usdt ? `<div class="addr"><code>${usdt}</code>
      <button onclick="navigator.clipboard.writeText('${usdt}');this.textContent='скопирован'">копировать</button></div>`
      : `<p style="color:var(--loss);font-size:12px;margin-top:10px">
         Кошелёк для приёма пока не указан в config.json — добавьте его перед приёмом оплат.</p>`}
    <div class="hint">
      Номер заявки: <b style="color:var(--txt)">${r.order_id}</b> · Ваша почта: ${ME.email}
      ${tg ? `<br>Поддержка: <a href="https://t.me/${tg.replace('@','')}" target="_blank">${tg}</a>` : ''}
    </div>`;
  box.scrollIntoView({behavior:'smooth', block:'center'});
}

boot();
</script>
</body>
</html>
